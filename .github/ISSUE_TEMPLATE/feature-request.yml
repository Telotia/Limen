name: Feature request
description: Suggest an improvement, new feature, or content addition
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why does this matter?
      description: What problem does it solve, or what value does it add?

  - type: dropdown
    id: priority
    attributes:
      label: How important is this?
      options:
        - Nice to have
        - Should have before launch
        - Must have before launch
    validations:
      required: true
