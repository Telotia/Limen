name: Deploy dev

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      # dev.telotia.com is a copy of telotia.com for testing (since 23 Oct 2026): the production build, kept out of search
      # results by a header on every file
      - run: bun run build:prod
      - name: Keep dev.telotia.com out of search results
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > dist/_headers
      - name: Deploy to limen-dev Worker
        run: bunx wrangler deploy --env=
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test dev URL
        run: bun run smoke:dev
