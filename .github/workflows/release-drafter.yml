name: Release Drafter

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [dev]

permissions:
  contents: read

jobs:
  update-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          commitish: dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
