<!doctype html>
<html><head><meta charset="utf-8"><title>Constellation motif</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; background: var(--ocean); background-color: var(--ocean-flat); color: var(--night-ink); }
  .frame { padding: 26px 28px; height: 220px; position: relative; overflow: hidden; }
  .frame svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--night-ink); }
  .frame .text { position: relative; }
  .label { font-family: var(--font-sans); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--night-ink-2); }
  .pull { font-family: var(--font-display); font-size: 26px; line-height: 1.2; color: var(--night-ink); font-weight: 380; letter-spacing: -.005em; max-width: 440px; margin-top: 10px; }
  .pull em { font-style: italic; color: var(--star); }
</style>
</head>
<body>
  <div class="frame">
    <svg class="bg" viewBox="0 0 640 220" preserveAspectRatio="xMidYMid slice" fill="none" aria-hidden="true">
      <g fill="currentColor" opacity="0.55">
        <circle cx="40" cy="40" r="0.8"/><circle cx="120" cy="30" r="0.6"/><circle cx="200" cy="70" r="0.7"/>
        <circle cx="260" cy="20" r="0.8"/><circle cx="340" cy="50" r="0.6"/><circle cx="430" cy="30" r="0.9"/>
        <circle cx="510" cy="60" r="0.7"/><circle cx="600" cy="40" r="0.7"/>
        <circle cx="60" cy="120" r="0.6"/><circle cx="160" cy="170" r="0.7"/>
        <circle cx="250" cy="150" r="0.6"/><circle cx="360" cy="190" r="0.7"/>
        <circle cx="470" cy="170" r="0.6"/><circle cx="560" cy="200" r="0.8"/>
        <circle cx="50" cy="200" r="0.7"/><circle cx="220" cy="200" r="0.6"/>
      </g>
      <g stroke="currentColor" stroke-width="0.6" opacity="0.55">
        <line x1="200" y1="70" x2="260" y2="20"/>
        <line x1="260" y1="20" x2="340" y2="50"/>
        <line x1="340" y1="50" x2="250" y2="150"/>
        <line x1="250" y1="150" x2="200" y2="70"/>
        <line x1="430" y1="30" x2="510" y2="60"/>
        <line x1="510" y1="60" x2="560" y2="200"/>
        <line x1="510" y1="60" x2="470" y2="170"/>
      </g>
      <g fill="#DEA193">
        <circle cx="260" cy="20" r="1.8"/><circle cx="340" cy="50" r="1.6"/>
        <circle cx="250" cy="150" r="1.4"/>
        <circle cx="510" cy="60" r="1.8"/>
      </g>
    </svg>
    <div class="text">
      <div class="label">Brand motif · constellations</div>
      <div class="pull">Chambers are <em>stars</em>; oscillations are the lines we draw between them.</div>
    </div>
  </div>
</body></html>
