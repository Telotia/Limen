<!doctype html>
<html><head><meta charset="utf-8"><title>Chamber glyphs</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .tile { background: var(--paper-2); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 16px 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tile svg { width: 28px; height: 28px; color: var(--ink); }
  .name { font-family: var(--font-display); font-size: 14px; color: var(--ink); }
  .sub { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: -.01em; }
</style>
</head>
<body>
  <div class="grid">
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><circle cx="12" cy="9" r="2.4" fill="currentColor"/><line x1="12" y1="11.4" x2="12" y2="20"/><line x1="6" y1="20" x2="18" y2="20"/></svg><div class="name">Telos</div><div class="sub">anchor</div></div>
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M5 12 Q12 7 19 12 Q12 17 5 12 Z"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg><div class="name">Inspection</div><div class="sub">observe</div></div>
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="5" cy="6" r="1.4" fill="currentColor"/><circle cx="19" cy="6" r="1.4" fill="currentColor"/><circle cx="12" cy="20" r="1.4" fill="currentColor"/><line x1="12" y1="12" x2="5" y2="6"/><line x1="12" y1="12" x2="19" y2="6"/><line x1="12" y1="12" x2="12" y2="20"/></svg><div class="name">Synthesis</div><div class="sub">propose</div></div>
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/><line x1="7" y1="10" x2="17" y2="14"/><line x1="7" y1="14" x2="17" y2="10"/></svg><div class="name">Debate</div><div class="sub">tension</div></div>
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 v6 L5 18 a2 2 0 0 0 2 3 h10 a2 2 0 0 0 2 -3 L14 9 V3"/><line x1="9" y1="3" x2="15" y2="3"/><circle cx="12" cy="16" r="0.8" fill="currentColor"/><circle cx="9" cy="18" r="0.6" fill="currentColor"/></svg><div class="name">Experiment</div><div class="sub">engage</div></div>
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><rect x="4" y="6" width="16" height="12" rx="1"/><line x1="4" y1="12" x2="20" y2="12" stroke-width="1.4"/><circle cx="20" cy="12" r="1.6" fill="currentColor"/></svg><div class="name">Slice</div><div class="sub">judge</div></div>
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="12" r="3" fill="currentColor" stroke="none"/><line x1="10" y1="12" x2="20" y2="12"/><polyline points="16,8 20,12 16,16"/></svg><div class="name">Sym ▸ Out</div><div class="sub">commission</div></div>
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="12" r="3" fill="currentColor" stroke="none"/><line x1="14" y1="12" x2="4" y2="12"/><polyline points="8,8 4,12 8,16"/></svg><div class="name">Sym ▸ In</div><div class="sub">re-house</div></div>
  </div>
</body></html>
