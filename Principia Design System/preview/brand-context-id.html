<!doctype html>
<html><head><meta charset="utf-8"><title>Context ID anatomy</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 28px 30px; }
  .label { font-family: var(--font-sans); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .id { font-family: var(--font-mono); font-size: 28px; line-height: 1; color: var(--ink); display: flex; gap: 0; margin-top: 14px; }
  .seg { position: relative; padding: 4px 6px; }
  .seg + .seg { margin-left: 2px; }
  .seg::after {
    content: attr(data-name);
    position: absolute; left: 50%; top: 100%;
    transform: translate(-50%, 12px);
    font-family: var(--font-display); font-style: italic; font-size: 12px;
    color: var(--ink-3); white-space: nowrap;
  }
  .seg.prefix { color: var(--ink-3); border-bottom: 1px solid var(--ink-4); }
  .seg.type   { color: var(--bloom); border-bottom: 1px solid var(--bloom); }
  .seg.hex    { color: var(--ink); border-bottom: 1px solid var(--ink-3); }
  .anchor { margin-top: 40px; font-family: var(--font-display); font-style: italic; font-size: 15px; color: var(--ink-2); line-height: 1.5; max-width: 100%; }
</style>
</head>
<body>
  <div class="label">Crystallized Context · anatomy</div>
  <div class="id">
    <span class="seg prefix" data-name="prefix">ctx</span>
    <span class="seg" style="color:var(--ink-3)">_</span>
    <span class="seg type" data-name="context type">slice</span>
    <span class="seg" style="color:var(--ink-3)">_</span>
    <span class="seg hex" data-name="content hash">a3f2b9c1</span>
  </div>
  <div class="anchor">Every chamber output crystallizes into one of these — immutable, never deleted, only superseded by a newer Context of the same type.</div>
</body></html>
