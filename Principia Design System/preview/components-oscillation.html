<!doctype html>
<html><head><meta charset="utf-8"><title>Oscillation Diagram</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 26px 28px; }
  .frame { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .legend { display: flex; gap: 18px; font-family: var(--font-sans); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .legend span b { color: var(--ink); font-weight: 500; margin-right: 4px; }
  svg { width: 100%; height: auto; display: block; }
  text { font-family: var(--font-sans); font-size: 11px; fill: var(--ink-2); letter-spacing: .04em; }
  text.lbl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; fill: var(--ink-3); }
  text.em { font-family: 'Newsreader', serif; font-style: italic; fill: var(--ink-2); font-size: 12px; }
  .node circle { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1; }
  .node--active circle { fill: var(--star); stroke: var(--ink); }
  .arrow { stroke: var(--ink-3); stroke-width: 1; fill: none; }
  .arrow--converged { stroke: var(--proven); stroke-width: 1.4; }
</style>
</head>
<body>
  <div class="frame">
    <div class="legend">
      <span><b>○</b>Oscillation</span>
      <span><b>★</b>Crystallize</span>
      <span><b>—</b>Pressure</span>
    </div>
    <svg viewBox="0 0 644 110">
      <!-- horizontal axis -->
      <line x1="20" y1="62" x2="624" y2="62" stroke="#C8D0E0" stroke-dasharray="2 3"/>

      <!-- arrows between -->
      <path class="arrow" d="M70 62 q 30 -30, 60 0"/>
      <path class="arrow" d="M140 62 q 30 -30, 60 0"/>
      <path class="arrow" d="M210 62 q 30 -30, 60 0"/>
      <path class="arrow arrow--converged" d="M280 62 q 30 -30, 60 0"/>

      <!-- nodes -->
      <g class="node"><circle cx="60" cy="62" r="9"/><text x="60" y="92" text-anchor="middle">Constructor</text></g>
      <g class="node"><circle cx="130" cy="62" r="9"/><text x="130" y="92" text-anchor="middle">Critic</text></g>
      <g class="node"><circle cx="200" cy="62" r="9"/><text x="200" y="92" text-anchor="middle">Constructor</text></g>
      <g class="node"><circle cx="270" cy="62" r="9"/><text x="270" y="92" text-anchor="middle">Critic</text></g>
      <g class="node node--active"><circle cx="340" cy="62" r="11"/><text x="340" y="92" text-anchor="middle" style="font-weight:500;fill:var(--ink)">Stabilizer</text></g>

      <!-- right side: crystallized seal -->
      <g transform="translate(440,28)">
        <text class="lbl" x="0" y="0">Crystallized Context</text>
        <text class="em" x="0" y="22">ctx_slice_a3f2b9c1</text>
        <text x="0" y="42">Status: <tspan font-family="Newsreader" font-style="italic" fill="#B57B19">Partial</tspan></text>
        <g transform="translate(160,16) scale(0.6)" fill="var(--ink-2)">
          <circle cx="0" cy="0" r="22" fill="none" stroke="currentColor" stroke-width="0.6" opacity=".7"/>
          <circle cx="0" cy="0" r="14" fill="none" stroke="currentColor" stroke-width="0.8"/>
          <circle cx="0" cy="0" r="2.4"/>
        </g>
      </g>

      <!-- osc labels above each pair -->
      <text class="lbl" x="95"  y="22" text-anchor="middle">osc 1</text>
      <text class="lbl" x="235" y="22" text-anchor="middle">osc 2</text>
      <text class="lbl" x="305" y="22" text-anchor="middle" style="fill:var(--proven)">converged</text>
    </svg>
  </div>
</body></html>
