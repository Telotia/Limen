<!doctype html>
<html><head><meta charset="utf-8"><title>Type · Italics</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 30px; }
  .pull { font-family: var(--font-display); font-size: 28px; line-height: 1.25; color: var(--ink); font-weight: 380; max-width: 100%; text-wrap: balance; }
  .pull em { font-style: italic; color: var(--ink-2); }
  .attr { font-family: var(--font-sans); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); margin-top: 16px; }
  .rule { border-top: 1px solid var(--rule); margin: 18px 0 6px; }
</style>
</head>
<body>
  <div class="pull">Mortality is the only <em>natural</em> death. Everything else is bookkeeping.</div>
  <div class="rule"></div>
  <div class="attr">From the canonical ontology · Principia v0.1.0</div>
</body></html>
