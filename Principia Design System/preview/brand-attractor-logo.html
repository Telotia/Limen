<link rel="stylesheet" href="_card.css">
<style>
  body {
    padding: 0;
    background: #060B1A;
    color: #F4F0FF;
  }
  .stage {
    position: relative;
    padding: 26px 32px 24px;
    background: radial-gradient(ellipse 110% 80% at 50% 30%, #1A2546 0%, #0A1430 55%, #060B1A 100%);
    overflow: hidden;
    min-height: 280px;
  }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(#ffffff22 0.6px, transparent 0.7px);
    background-size: 21px 21px;
  }
  .header { position: relative; display: flex; align-items: baseline; justify-content: space-between; }
  .label { font-family: var(--font-sans); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #B9B2D6; }
  .id    { font-family: var(--font-mono); font-size: 11px; color: #8A82A8; }
  .wrap  { position: relative; display: flex; align-items: center; gap: 32px; margin-top: 6px; }
  .mark  { width: 320px; height: 200px; flex: 0 0 320px; filter: drop-shadow(0 0 14px rgba(91, 124, 250, 0.18)); }
  .meta  { position: relative; }
  .meta h1 { font-family: var(--font-display); font-size: 32px; font-weight: 400; line-height: 1.05; color: #F4F0FF; letter-spacing: -.5px; margin: 0 0 6px; }
  .meta p  { font-family: var(--font-display); font-style: italic; font-size: 15px; color: #D8D6E8; line-height: 1.5; max-width: 280px; text-wrap: pretty; margin: 0; }
  .meta p em { color: #DEA193; font-style: italic; font-family: var(--font-display); }
  .footer  { display: flex; gap: 18px; margin-top: 12px; font-family: var(--font-mono); font-size: 11px; color: #8A82A8; }
</style>
</head>
