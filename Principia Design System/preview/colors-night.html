<!doctype html>
<html><head><meta charset="utf-8"><title>Color · Ocean &amp; Rose</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px; }
  .palette { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr; gap: 12px; }
  .swatch { border-radius: var(--r-3); overflow: hidden; border: 1px solid var(--rule); }
  .swatch .chip { height: 76px; position: relative; }
  .swatch.ocean .chip {
    background: var(--ocean);
    background-color: var(--ocean-flat);
  }
  .swatch.ocean .chip::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(#ffffff35 0.6px, transparent 0.7px),
                      radial-gradient(#DEA19330 0.5px, transparent 0.6px);
    background-size: 13px 13px, 21px 21px;
    background-position: 3px 4px, 7px 9px;
  }
  .swatch .meta { padding: 9px 10px 11px; background: var(--paper); }
  .swatch .name { font-family: var(--font-display); font-size: 14px; line-height: 1.05; color: var(--ink); }
  .swatch .hex { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); margin-top: 3px; }
  .swatch .var { font-family: var(--font-mono); font-size: 9px; color: var(--ink-4); margin-top: 1px; }
</style>
</head>
<body>
  <div class="palette">
    <div class="swatch ocean">
      <div class="chip"></div>
      <div class="meta"><div class="name">Ocean</div><div class="hex">radial gradient</div><div class="var">--ocean</div></div>
    </div>
    <div class="swatch"><div class="chip" style="background:#0A1430"></div>
      <div class="meta"><div class="name">Night</div><div class="hex">#0A1430</div><div class="var">--night</div></div></div>
    <div class="swatch"><div class="chip" style="background:#1F3160"></div>
      <div class="meta"><div class="name">Surface</div><div class="hex">#1F3160</div><div class="var">--night-3</div></div></div>
    <div class="swatch"><div class="chip" style="background:#DEA193"></div>
      <div class="meta"><div class="name">Rose</div><div class="hex">#DEA193</div><div class="var">--rose</div></div></div>
    <div class="swatch"><div class="chip" style="background:#B07A6A"></div>
      <div class="meta"><div class="name">Rose&nbsp;Soft</div><div class="hex">#B07A6A</div><div class="var">--rose-soft</div></div></div>
  </div>
</body></html>
