<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .btn {
    font-family: var(--font-sans);
    font-size: 13px; font-weight: 500;
    padding: 8px 14px;
    border: 1px solid transparent;
    border-radius: var(--r-2);
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease-press), border-color var(--dur-fast);
    display: inline-flex; align-items: center; gap: 6px;
    letter-spacing: 0;
  }

  /* Primary — ink on paper, the dominant act */
  .btn--primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn--primary:hover { background: #000; }

  /* Secondary — outlined */
  .btn--secondary { background: var(--paper); color: var(--ink); border-color: var(--ink-3); }
  .btn--secondary:hover { border-color: var(--ink); background: var(--paper-2); }

  /* Quiet — text-only */
  .btn--quiet { background: transparent; color: var(--ink-2); }
  .btn--quiet:hover { color: var(--ink); background: var(--paper-2); }

  /* Star — the rare crystallize action */
  .btn--star { background: var(--star); color: var(--ink); border-color: var(--star-soft); box-shadow: var(--inset); }
  .btn--star:hover { background: #EACF7E; }

  /* Falsified — destructive */
  .btn--danger { background: var(--paper); color: var(--falsified); border-color: var(--falsified); }
  .btn--danger:hover { background: var(--falsified); color: var(--paper); }

  .btn svg { width: 14px; height: 14px; }
  .meta { font-family: var(--font-sans); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); width: 96px; }
  .group { display: flex; align-items: center; gap: 14px; }
</style>
</head>
<body>
  <div class="group">
    <div class="meta">Primary</div>
    <button class="btn btn--primary"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5 v14 L20 12 Z"/></svg>Run organism</button>
    <button class="btn btn--secondary">View ontology</button>
    <button class="btn btn--quiet">Cancel</button>
  </div>
  <div class="group">
    <div class="meta">Stateful</div>
    <button class="btn btn--star">⊛ Crystallize</button>
    <button class="btn btn--danger">Falsify</button>
    <button class="btn btn--secondary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><polyline points="5,12 10,17 19,7"/></svg>Mark Proven</button>
  </div>
  <div class="group">
    <div class="meta">States</div>
    <button class="btn btn--primary">Normal</button>
    <button class="btn btn--primary" style="background:#000">Hover</button>
    <button class="btn btn--primary" style="opacity:.45;cursor:not-allowed">Disabled</button>
  </div>
</body></html>
